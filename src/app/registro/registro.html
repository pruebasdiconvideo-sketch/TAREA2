<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm auth-card">
      <div class="card-header bg-cafe text-light text-center">
        <h3 class="mb-0">Crear cuenta</h3>
        <p class="small mb-0 mt-1 opacity-75">Regístrate como cliente de Café Andino</p>
      </div>
      <div class="card-body p-4">
        <form #form="ngForm" (ngSubmit)="registrar(form)">
          <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" name="nombre" [(ngModel)]="nombre"
                   placeholder="Tu nombre y apellido" required minlength="3">
          </div>

          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" name="email" [(ngModel)]="email"
                   placeholder="correo@ejemplo.com" required email>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" name="password"
                   [(ngModel)]="password" placeholder="Mínimo 4 caracteres" required minlength="4">
          </div>

          <div class="mb-3">
            <label class="form-label">Confirmar contraseña</label>
            <input type="password" class="form-control" name="confirmar"
                   [(ngModel)]="confirmar" placeholder="Repite tu contraseña" required>
            <div class="form-text text-danger" *ngIf="clavesDistintas">
              Las contraseñas no coinciden.
            </div>
          </div>

          <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

          <button type="submit" class="btn btn-cafe w-100" [disabled]="cargando">
            <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
            {{ cargando ? 'Creando cuenta...' : 'Crear cuenta' }}
          </button>
        </form>

        <hr class="my-4" />
        <p class="text-center text-muted small mb-0">
          ¿Ya tienes cuenta?
          <a routerLink="/login" class="text-cafe fw-semibold text-decoration-none">Iniciar sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
